[tools]
rust = { version = "1.98.0", components = ["clippy", "rustfmt"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:openai/codex" = "0.151.0"
"aqua:temporalio/cli" = "1.8.2"
"aqua:protocolbuffers/protobuf/protoc" = "36.1"

[tasks.lint]
description = "Run repository and Rust lint checks"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [ -d .github/workflows ]; then
  ghalint run
  pinact run --check --verify-comment
fi

if [ -f Cargo.toml ]; then
  cargo fmt --all -- --check
  cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
else
  echo "Cargo.toml not present yet; skipping Rust lint checks."
fi
"""

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --workspace --locked"

[tasks.build]
description = "Build the Rust workspace"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [ -f Cargo.toml ]; then
  cargo build --workspace --locked
else
  echo "Cargo.toml not present yet; skipping Rust build."
fi
"""

[tasks."contract:hermetic"]
description = "Run credential-free contract harness tests"
run = "mise run test"

[tasks."contract:macos"]
description = "Preflight explicitly enabled macOS contract tests"
run = "scripts/contracts/macos.sh"

[tasks."contract:temporal"]
description = "Run the explicitly enabled local Temporal persistence contract"
run = "scripts/contracts/temporal.sh"

[tasks."contract:temporal-messages"]
description = "Run the explicitly enabled local Temporal message contract"
run = "scripts/contracts/temporal-messages.sh"

[tasks."contract:temporal-activities"]
description = "Run the explicitly enabled local Temporal Activity recovery contract"
run = "scripts/contracts/temporal-activities.sh"

[tasks."contract:live"]
description = "Preflight explicitly enabled live-provider contract tests"
run = "scripts/contracts/live.sh"
