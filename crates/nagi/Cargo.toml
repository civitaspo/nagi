[package]
name = "nagi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
macos-keychain-contract = []

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.4.3"
httparse = "=1.10.1"
libc = "=0.2.189"
oauth2 = { version = "=5.0.0", default-features = false, features = [
    "reqwest-blocking",
    "rustls-tls",
    "timing-resistant-secret-traits",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = { version = "=1.9.0", features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = "=2.17.0"

[dev-dependencies]
toml = "=1.1.4"

[[test]]
name = "macos_keychain_contract"
path = "tests/macos_keychain_contract.rs"
required-features = ["macos-keychain-contract"]
