[package]
name = "nagi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
macos-keychain-contract = []
temporal-message-contract = [
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-sdk",
    "dep:temporalio-workflow",
    "dep:futures-util",
    "dep:tokio",
]
temporal-activity-contract = [
    "dep:futures",
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-sdk",
    "dep:temporalio-workflow",
    "dep:tokio",
]
temporal-replay-contract = [
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-sdk",
    "dep:temporalio-workflow",
    "dep:tokio",
]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
httparse = "=1.10.1"
libc = "=0.2.189"
oauth2 = { version = "=5.0.0", default-features = false, features = [
    "reqwest-blocking",
    "rustls-tls",
    "timing-resistant-secret-traits",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["alloc"] }
futures = { version = "=0.3.34", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = [
    "async-await-macro",
], optional = true }
temporalio-client = { version = "=0.7.0", default-features = false, optional = true }
temporalio-common = { version = "=0.7.0", default-features = false, optional = true }
temporalio-sdk = { version = "=0.7.0", default-features = false, optional = true }
temporalio-workflow = { version = "=0.7.0", default-features = false, optional = true }
tokio = { version = "=1.47.0", default-features = false, features = [
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "time",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = "=2.17.0"

[dev-dependencies]
toml = "=1.1.4"

[[test]]
name = "macos_keychain_contract"
path = "tests/macos_keychain_contract.rs"
required-features = ["macos-keychain-contract"]

[[test]]
name = "temporal_message_contract"
path = "tests/temporal_message_contract.rs"
required-features = ["temporal-message-contract"]

[[test]]
name = "temporal_activity_contract"
path = "tests/temporal_activity_contract.rs"
required-features = ["temporal-activity-contract"]

[[test]]
name = "temporal_replay_contract"
path = "tests/temporal_replay_contract.rs"
required-features = ["temporal-replay-contract"]
